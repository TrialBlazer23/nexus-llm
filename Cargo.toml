[package]
name = "nexus"
version = "0.2.0"
edition = "2021"
authors = ["Nexus-LLM Team"]

[lib]
name = "nexus"
path = "src/lib.rs"

[[bin]]
name = "nexus"
path = "src/main.rs"

[[bin]]
name = "nexusd"
path = "src/daemon.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.13"
toml = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"] }
http-body-util = "0.1"
bytes = "1"
http = "1"
libc = "0.2"
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.10"
hmac = "0.13"
crc16 = "0.4"
tokio-stream = "0.1"
eventsource-stream = "0.2"
futures-util = "0.3"
socket2 = "0.6"
mdns-sd = { version = "0.21.4", default-features = false, features = ["async"] }
sha2 = "0.11"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
pulldown-cmark = { version = "0.13", default-features = false }
redb = "4.3.0"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.5"
